MYTGT=esp32s3
export ESPBAUD=2000000
export SERIAL=/dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_0255CF15-if00-port0
IDF_COMPONENT="# empty for this build"      # no ethernet here, the capture leaves over UART

#
# the OTA url carries a secret path, so it stays in mcfg_local.h - which is in no repo -
# and is read from there at build time rather than being committed into this file
#
OTA_URL_FW_DIR=$(sed -n 's/^#define URL_FW_DIR *_w1("\(.*\)").*/\1/p' ~/esp/mcfg_local.h)
#
# the time server the rest of the fleet uses, from the same place: the sniffers poll it every
# minute (SNIFF_NTP_SYNC_MS), which a LAN server takes in its stride and a public pool should not
#
export SNIFF_NTP=$(sed -n 's/^#define NTP_SERVER *"\(.*\)".*/\1/p' ~/esp/mcfg_local.h)

# --------------------------------------------------------------------------------------------------------------
if (( ENTITY == 87 )); then     # esp32-87  esp32-s3-eth wave share R8MTH4 16MB Flash/ 8MB PSRAM   CMP range probe
    (( OTA_ENTITY = ENTITY - 1 ))
    MYTGT=esp32s3
    export ESPBAUD=2000000
    export SERIAL=/dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_0255CF15-if00-port0
    SDK_VERS=WAVESHARE_S3ETH_16MBFLASH_PSRAM_sniff

    # esp32-87 is deployed as an ethernet collector, not a bench unit on a cable
    export SNIFF_COLLECTOR=192.168.0.11  # old
    export SNIFF_COLLECTOR=192.168.0.12  # new

    export SNIFF_OTA_URL=$OTA_URL_FW_DIR
    IDF_COMPONENT=$(cat << '!'
    dependencies:
      ethernet_init:
        path: ${IDF_PATH}/examples/ethernet/basic/components/ethernet_init
!
    )
# --------------------------------------------------------------------------------------------------------------
elif (( ENTITY == 57 || ENTITY == 63 || ENTITY == 89 || ENTITY == 91 )); then
    #
    # the eth01 collectors. all LAN8720 over the internal EMAC and the same pinning, so
    # the only thing that separates them is flash size: the esp32-eth01 V1781 boards
    # (63/89) carry 8MB, the wt32-eth01 TENSTAR one (57) carries 4MB.
    #
    # SERIAL names the flasher, not the board - the by-id path follows the adapter, so
    # clip it onto whichever board is being flashed and leave this alone. esp32-87 and
    # esp32-89 update over the air now, so their adapters are free for this.
    #
    (( OTA_ENTITY = ENTITY - 1 ))
    MYTGT=esp32
    export ESPBAUD=460800
    export SERIAL=/dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_02EXVH5I-if00-port0
    # default to the V1781 board, and name the exception by its board rather than by
    # entity number, so another V1781 needs no change here
    SDK_VERS=esp32_8MBFLASH_wireless_tag_sniff                        # esp32-eth01 V1781
    (( ENTITY == 57 )) && SDK_VERS=esp32_4MBFLASH_wireless_tag_sniff  # wt32-eth01 TENSTAR

    # the capture leaves over ethernet, so name the collector and pull in the eth driver
    export SNIFF_COLLECTOR=192.168.0.11  # old
    export SNIFF_COLLECTOR=192.168.0.12  # new
    export SNIFF_OTA_URL=$OTA_URL_FW_DIR
    IDF_COMPONENT=$(cat << '!'
    dependencies:
      ethernet_init:
        path: ${IDF_PATH}/examples/ethernet/basic/components/ethernet_init
!
    )
else
    echo "$0: no entity $ENTITY in buildit.cfg, exiting" && exit
fi
